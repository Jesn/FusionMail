# Fly.io 配置文件
# 部署命令: fly deploy

app = "fusionmail"
primary_region = "nrt"  # 东京

[build]

[env]
  # 时区设置：统一使用 UTC
  # 原因：
  # 1. 数据库层已配置 UTC（GORM NowFunc）
  # 2. 支持跨国/分布式部署，避免时区混乱
  # 3. 国际标准，无歧义
  # 注意：前端展示时需要转换为用户本地时区
  TZ = "UTC"
  
  # Supabase Transaction 模式配置（端口 6543）
  DB_PORT = "6543"
  DB_NAME = "postgres"
  DB_SSLMODE = "require"
  # Transaction 模式必须禁用 PrepareStmt，否则会报 "prepared statement does not exist"
  DB_DISABLE_PREPARE_STMT = "true"
  # Transaction 模式连接池优化参数
  DB_MAX_IDLE_CONNS = "2"
  DB_MAX_OPEN_CONNS = "10"
  DB_CONN_MAX_LIFETIME = "30"
  
  # Aiven Valkey (Redis) 配置
  REDIS_HOST = "valkey-fusionmail-xyz-dbc2.c.aivencloud.com"
  REDIS_PORT = "16559"
  REDIS_USER = "default"
  REDIS_TLS = "true"
  SERVER_HOST = "0.0.0.0"
  SERVER_PORT = "3333"
  STORAGE_TYPE = "local"
  STORAGE_LOCAL_PATH = "/data/attachments"
  COOKIE_SECURE = "true"
  RATE_LIMIT_ENABLED = "true"
  SWAGGER_ENABLED = "false"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # 增加请求超时时间，支持长时间同步操作
  # 同步大量邮件可能需要几分钟（单位：秒）
  [http_service.http_options]
    idle_timeout = 300
    response_header_timeout = 300

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "60s"
  interval = "60s"
  method = "GET"
  timeout = "30s"
  path = "/api/v1/health"

[mounts]
  source = "fusionmail_data"
  destination = "/data"
