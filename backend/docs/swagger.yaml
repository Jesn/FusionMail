definitions:
  fusionmail_internal_dto.PaginatedResponse:
    properties:
      code:
        description: 错误码
        type: integer
      data: {}
      error:
        type: string
      message:
        type: string
      page:
        type: integer
      size:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
  fusionmail_internal_dto_request.CreateRuleRequest:
    properties:
      account_uid:
        description: 账户 UID
        type: string
      actions:
        description: 动作列表
        items:
          $ref: '#/definitions/fusionmail_internal_model.RuleAction'
        minItems: 1
        type: array
      conditions:
        description: 条件列表
        items:
          $ref: '#/definitions/fusionmail_internal_model.RuleCondition'
        minItems: 1
        type: array
      description:
        description: 规则描述
        type: string
      enabled:
        description: 是否启用
        type: boolean
      match_mode:
        description: 匹配模式：all（所有条件）或 any（任意条件）
        type: string
      name:
        description: 规则名称
        type: string
      priority:
        description: 优先级（数字越小优先级越高）
        type: integer
      stop_processing:
        description: 匹配后是否停止处理后续规则
        type: boolean
    required:
    - account_uid
    - actions
    - conditions
    - match_mode
    - name
    type: object
  fusionmail_internal_dto_request.MarkAllAsReadRequest:
    properties:
      account_uid:
        description: 账户 UID，为空则应用于所有账号
        type: string
    type: object
  fusionmail_internal_dto_request.TestRuleRequest:
    properties:
      body:
        description: 邮件正文
        type: string
      from_address:
        description: 发件人地址
        type: string
      has_attachment:
        description: 是否有附件
        type: boolean
      subject:
        description: 邮件主题
        type: string
      to_address:
        description: 收件人地址
        type: string
    type: object
  fusionmail_internal_dto_request.UpdateRuleRequest:
    properties:
      actions:
        description: 动作列表
        items:
          $ref: '#/definitions/fusionmail_internal_model.RuleAction'
        type: array
      conditions:
        description: 条件列表
        items:
          $ref: '#/definitions/fusionmail_internal_model.RuleCondition'
        type: array
      description:
        description: 规则描述
        type: string
      enabled:
        description: 是否启用
        type: boolean
      match_mode:
        description: 匹配模式
        type: string
      name:
        description: 规则名称
        type: string
      priority:
        description: 优先级
        type: integer
      stop_processing:
        description: 是否停止处理后续规则
        type: boolean
    type: object
  fusionmail_internal_model.EmailRule:
    properties:
      account_uid:
        description: 所属账户
        type: string
      actions:
        description: 执行动作（JSON）
        items:
          $ref: '#/definitions/fusionmail_internal_model.RuleAction'
        type: array
      conditions:
        description: 触发条件（JSON）
        items:
          $ref: '#/definitions/fusionmail_internal_model.RuleCondition'
        type: array
      created_at:
        type: string
      description:
        type: string
      enabled:
        description: 规则配置
        type: boolean
      id:
        type: integer
      last_matched_at:
        type: string
      match_mode:
        description: 匹配模式：all（所有条件）或 any（任意条件）
        type: string
      matched_count:
        description: 统计信息
        type: integer
      name:
        type: string
      priority:
        description: 优先级（数字越小越高）
        type: integer
      stop_processing:
        description: 匹配后是否停止处理后续规则
        type: boolean
      updated_at:
        type: string
    type: object
  fusionmail_internal_model.OAuth2ClientCreateRequest:
    properties:
      client_id:
        maxLength: 255
        type: string
      client_secret:
        type: string
      metadata:
        type: string
      name:
        maxLength: 100
        type: string
      provider_id:
        description: 提供商ID
        type: integer
      quota_daily:
        minimum: -1
        type: integer
      quota_monthly:
        minimum: -1
        type: integer
      redirect_uri:
        type: string
    required:
    - client_id
    - client_secret
    - name
    - provider_id
    - redirect_uri
    type: object
  fusionmail_internal_model.OAuth2ClientResponse:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      is_default:
        type: boolean
      last_used_at:
        type: string
      metadata:
        type: string
      name:
        type: string
      provider_id:
        type: integer
      provider_name:
        description: 提供商名称（通过关联获取）
        type: string
      quota_daily:
        type: integer
      quota_monthly:
        type: integer
      redirect_uri:
        type: string
      updated_at:
        type: string
      usage_count:
        type: integer
    type: object
  fusionmail_internal_model.OAuth2ClientUpdateRequest:
    properties:
      client_id:
        maxLength: 255
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      metadata:
        type: string
      name:
        maxLength: 100
        type: string
      provider_id:
        description: 提供商ID（可选）
        type: integer
      quota_daily:
        minimum: -1
        type: integer
      quota_monthly:
        minimum: -1
        type: integer
      redirect_uri:
        type: string
    type: object
  fusionmail_internal_model.Provider:
    properties:
      created_at:
        description: 时间戳
        type: string
      description:
        description: 描述信息
        type: string
      display_name:
        description: 显示名称
        type: string
      enabled:
        description: 管理字段
        type: boolean
      id:
        type: integer
      imap_host:
        description: 服务器配置
        type: string
      imap_port:
        description: IMAP端口
        type: integer
      metadata:
        description: JSON格式的额外配置
        type: string
      name:
        description: 基础信息
        type: string
      pop3_host:
        description: POP3服务器地址
        type: string
      pop3_port:
        description: POP3端口
        type: integer
      provider_type:
        description: 提供商类型（枚举值）
        type: integer
      recommended_protocol:
        description: 推荐协议
        type: string
      requires_oauth:
        description: 是否强制OAuth
        type: boolean
      smmtp_port:
        description: SMTP端口（预留）
        type: integer
      smtp_host:
        description: SMTP服务器地址（预留）
        type: string
      sort_order:
        description: 排序顺序
        type: integer
      updated_at:
        type: string
    type: object
  fusionmail_internal_model.ProviderResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      imap_host:
        type: string
      imap_port:
        type: integer
      metadata:
        type: string
      name:
        type: string
      pop3_host:
        type: string
      pop3_port:
        type: integer
      provider_type:
        description: 提供商类型
        type: integer
      recommended_protocol:
        type: string
      requires_oauth:
        type: boolean
      smtp_host:
        type: string
      smtp_port:
        type: integer
      sort_order:
        type: integer
      supported_protocols:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  fusionmail_internal_model.RuleAction:
    properties:
      type:
        description: 动作类型：add_label, remove_label, mark_read, mark_unread, star, unstar,
          archive, delete, move_folder, webhook
        type: string
      value:
        description: 动作参数
        type: string
    type: object
  fusionmail_internal_model.RuleCondition:
    properties:
      field:
        description: 字段：from, to, subject, body, has_attachment
        type: string
      operator:
        description: 操作符：contains, not_contains, equals, not_equals, starts_with,
          ends_with, regex
        type: string
      value:
        description: 值
        type: string
    type: object
  fusionmail_internal_service.AccountEmailStats:
    properties:
      archived_count:
        type: integer
      starred_count:
        type: integer
      total_count:
        type: integer
      unread_count:
        type: integer
    type: object
  fusionmail_internal_service.EmailListItem:
    properties:
      account_uid:
        type: string
      attachments_count:
        type: integer
      bcc_addresses:
        type: string
      cc_addresses:
        type: string
      created_at:
        type: string
      from_address:
        type: string
      from_name:
        type: string
      has_attachments:
        type: boolean
      id:
        type: integer
      is_archived:
        type: boolean
      is_deleted:
        type: boolean
      is_read:
        type: boolean
      is_starred:
        type: boolean
      labels:
        type: string
      message_id:
        type: string
      provider_id:
        type: string
      received_at:
        type: string
      sent_at:
        type: string
      snippet:
        type: string
      subject:
        type: string
      thread_id:
        type: string
      to_addresses:
        type: string
      updated_at:
        type: string
    type: object
  fusionmail_internal_service.EmailListResponse:
    properties:
      emails:
        items:
          $ref: '#/definitions/fusionmail_internal_service.EmailListItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  fusionmail_internal_service.GlobalEmailStats:
    properties:
      archived_count:
        type: integer
      deleted_count:
        type: integer
      spam_count:
        type: integer
      starred_count:
        type: integer
      total_count:
        type: integer
      unread_count:
        type: integer
    type: object
  fusionmail_internal_service.OAuth2AuthResponse:
    properties:
      auth_url:
        type: string
      state:
        type: string
    type: object
  fusionmail_internal_service.OAuth2CallbackResponse:
    properties:
      access_token:
        type: string
      account_uid:
        type: string
      email:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  fusionmail_internal_service.OAuth2TokenRefreshResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
    type: object
  internal_handler.AddToBlacklistRequest:
    properties:
      reason:
        description: 添加原因
        type: string
      target:
        description: 邮箱地址或域名
        type: string
    required:
    - target
    type: object
  internal_handler.AddToWhitelistRequest:
    properties:
      reason:
        description: 添加原因
        type: string
      target:
        description: 邮箱地址或域名
        type: string
    required:
    - target
    type: object
  internal_handler.BatchPermanentDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  internal_handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  internal_handler.CreateWebhookRequest:
    properties:
      description:
        type: string
      events:
        type: string
      filters:
        type: string
      headers:
        type: string
      max_retries:
        type: integer
      method:
        type: string
      name:
        type: string
      retry_enabled:
        type: boolean
      retry_intervals:
        type: string
      url:
        type: string
    required:
    - events
    - name
    - url
    type: object
  internal_handler.DBUserInfo:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      theme:
        type: string
      username:
        type: string
    type: object
  internal_handler.LoginRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  internal_handler.LoginResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
    type: object
  internal_handler.MailListData:
    properties:
      emails: {}
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_handler.MarkAsReadRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  internal_handler.ReceiveMailResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.MailListData'
      success:
        type: boolean
    type: object
  internal_handler.RefreshTokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_handler.SearchMailData:
    properties:
      emails: {}
      limit:
        type: integer
      offset:
        type: integer
      query:
        type: string
      total:
        type: integer
    type: object
  internal_handler.SearchMailResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.SearchMailData'
      success:
        type: boolean
    type: object
  internal_handler.TestWebhookRequest:
    properties:
      test_data:
        additionalProperties: true
        type: object
    type: object
  internal_handler.UpdateWebhookRequest:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      events:
        type: string
      filters:
        type: string
      headers:
        type: string
      max_retries:
        type: integer
      method:
        type: string
      name:
        type: string
      retry_enabled:
        type: boolean
      retry_intervals:
        type: string
      url:
        type: string
    required:
    - events
    - name
    - url
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  response.TestRuleResponse:
    properties:
      matched:
        description: 是否匹配
        type: boolean
      rule:
        allOf:
        - $ref: '#/definitions/fusionmail_internal_model.EmailRule'
        description: 规则信息
    type: object
info:
  contact: {}
paths:
  /api/v1/dev/sync-from-env:
    post:
      consumes:
      - application/json
      description: 同步 OAuth2 客户端配置从环境变量
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 从环境变量同步数据到数据库
      tags:
      - 开发工具
  /api/v1/emaillist/blacklist:
    get:
      consumes:
      - application/json
      description: 获取用户的黑名单列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取黑名单
      tags:
      - emaillist
    post:
      consumes:
      - application/json
      description: 添加邮箱地址或域名到黑名单
      parameters:
      - description: 黑名单信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AddToBlacklistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
      summary: 添加到黑名单
      tags:
      - emaillist
  /api/v1/emaillist/blacklist/{id}:
    delete:
      consumes:
      - application/json
      description: 从黑名单中删除指定条目
      parameters:
      - description: 条目 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 从黑名单中删除
      tags:
      - emaillist
  /api/v1/emaillist/whitelist:
    get:
      consumes:
      - application/json
      description: 获取用户的白名单列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取白名单
      tags:
      - emaillist
    post:
      consumes:
      - application/json
      description: 添加邮箱地址或域名到白名单
      parameters:
      - description: 白名单信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AddToWhitelistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
      summary: 添加到白名单
      tags:
      - emaillist
  /api/v1/emaillist/whitelist/{id}:
    delete:
      consumes:
      - application/json
      description: 从白名单中删除指定条目
      parameters:
      - description: 条目 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 从白名单中删除
      tags:
      - emaillist
  /api/v1/emails/{id}:
    delete:
      consumes:
      - application/json
      description: 删除邮件（软删除，仅本地状态）
      parameters:
      - description: 邮件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 删除邮件
      tags:
      - emails
    get:
      consumes:
      - application/json
      description: 根据 ID 获取邮件的完整信息，包括附件
      parameters:
      - description: 邮件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取邮件详情
      tags:
      - emails
  /api/v1/emails/{id}/archive:
    post:
      consumes:
      - application/json
      description: 归档邮件（仅本地状态）
      parameters:
      - description: 邮件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 归档邮件
      tags:
      - emails
  /api/v1/emails/{id}/permanent:
    delete:
      consumes:
      - application/json
      description: 永久删除回收站中的邮件（物理删除，不可恢复）
      parameters:
      - description: 邮件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 永久删除邮件
      tags:
      - emails
  /api/v1/emails/{id}/restore:
    post:
      consumes:
      - application/json
      description: 将邮件从本地垃圾箱恢复（仅本地状态）
      parameters:
      - description: 邮件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 恢复已删除邮件
      tags:
      - emails
  /api/v1/emails/{id}/toggle-star:
    post:
      consumes:
      - application/json
      description: 切换邮件的星标状态（仅本地状态）
      parameters:
      - description: 邮件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 切换星标状态
      tags:
      - emails
  /api/v1/emails/empty-trash:
    post:
      consumes:
      - application/json
      description: 永久删除回收站中的所有邮件（物理删除，不可恢复）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 清空回收站
      tags:
      - emails
  /api/v1/emails/mark-all-read:
    post:
      consumes:
      - application/json
      description: 批量标记所有未读邮件为已读（仅本地状态），可选择指定账号或全部账号
      parameters:
      - description: 标记请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/fusionmail_internal_dto_request.MarkAllAsReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 全部标记为已读
      tags:
      - emails
  /api/v1/emails/mark-read:
    post:
      consumes:
      - application/json
      description: 批量标记邮件为已读（仅本地状态）
      parameters:
      - description: 邮件 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.MarkAsReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 标记邮件为已读
      tags:
      - emails
  /api/v1/emails/mark-unread:
    post:
      consumes:
      - application/json
      description: 批量标记邮件为未读（仅本地状态）
      parameters:
