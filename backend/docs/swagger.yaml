info:
  contact: {}
paths:
  /api/v1/accounts/{uid}/smtp:
    get:
      consumes:
      - application/json
      description: 获取账户的 SMTP 发送配置
      parameters:
      - description: 账户UID
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SMTPConfigResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 获取 SMTP 配置
      tags:
      - 账户管理
    put:
      consumes:
      - application/json
      description: 更新账户的 SMTP 发送配置（SMTP 使用与接收邮件相同的凭证）
      parameters:
      - description: 账户UID
        in: path
        name: uid
        required: true
        type: string
      - description: SMTP配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateSMTPConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 更新 SMTP 配置
      tags:
      - 账户管理
  /api/v1/accounts/{uid}/smtp/test:
