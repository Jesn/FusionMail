definitions:
  dto.PaginatedResponse:
    properties:
      code:
        description: 错误码
        type: integer
      data: {}
      error:
        type: string
      message:
        type: string
      page:
        type: integer
      size:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
  dto.Response:
    properties:
      code:
        description: 错误码
        type: integer
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handler.AddToBlacklistRequest:
    properties:
      reason:
        description: 添加原因
        type: string
      target:
        description: 邮箱地址或域名
        type: string
    required:
    - target
    type: object
  handler.AddToWhitelistRequest:
    properties:
      reason:
        description: 添加原因
        type: string
      target:
        description: 邮箱地址或域名
        type: string
    required:
    - target
    type: object
  handler.BatchPermanentDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.CreateWebAPIProviderRequest:
    properties:
      auth_data:
        description: 认证数据 JSON
        type: string
      group_id:
        description: 分组 ID（可选）
        type: integer
      name:
        description: Provider 名称（可选，如果不填则从配置中提取或自动生成）
        type: string
      service_type:
        description: 服务类型
        type: string
      sync_enabled:
        description: 是否启用同步（可选，默认 true）
        type: boolean
      sync_interval:
        description: 同步间隔（分钟，可选，默认 2）
        type: integer
    required:
    - auth_data
    - service_type
    type: object
  handler.CreateWebhookRequest:
    properties:
      description:
        type: string
      events:
        type: string
      filters:
        type: string
      headers:
        type: string
      max_retries:
        type: integer
      method:
        type: string
      name:
        type: string
      retry_enabled:
        type: boolean
      retry_intervals:
        type: string
      url:
        type: string
    required:
    - events
    - name
    - url
    type: object
  handler.DBLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.DBLoginResponse:
    properties:
      expiresAt:
        type: string
      requires_2fa:
        description: 是否需要 2FA 验证
        type: boolean
      token:
        type: string
      two_factor_user_id:
        description: 2FA 验证用的用户 ID
        type: integer
      user:
        $ref: '#/definitions/handler.DBUserInfo'
    type: object
  handler.DBUserInfo:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      theme:
        type: string
      username:
        type: string
    type: object
  handler.Disable2FARequest:
    properties:
      code:
        description: TOTP 码或恢复码（必填）
        type: string
      password:
        type: string
    required:
    - code
    - password
    type: object
  handler.FetchCloudflareTempEmailSettingsRequest:
    properties:
      base_url:
        description: API 基础 URL
        type: string
      jwt_token:
        description: JWT Token
        type: string
    required:
    - base_url
    - jwt_token
    type: object
  handler.ForwardRequest:
    properties:
      account_uid:
        type: string
      cc:
        items:
          type: string
        type: array
      html_body:
        type: string
      text_body:
        type: string
      to:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - account_uid
    - to
    type: object
  handler.MailListData:
    properties:
      emails: {}
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  handler.MarkAsReadRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.MarkMailAsReadRequest:
    properties:
      ids:
        description: 邮件 ID 列表
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handler.MarkMailAsReadResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.ReceiveMailResponse:
    properties:
      data:
        $ref: '#/definitions/handler.MailListData'
      success:
        type: boolean
    type: object
  handler.ReplyRequest:
    properties:
      account_uid:
        type: string
      html_body:
        type: string
      text_body:
        type: string
    required:
    - account_uid
    type: object
  handler.SMTPTestRequest:
    properties:
      password:
        description: 临时密码，用于测试未保存的配置
        type: string
      username:
        description: 临时用户名，用于测试未保存的配置
        type: string
    type: object
  handler.SearchMailData:
    properties:
      emails: {}
      limit:
        type: integer
      offset:
        type: integer
      query:
        type: string
      total:
        type: integer
    type: object
  handler.SearchMailResponse:
    properties:
      data:
        $ref: '#/definitions/handler.SearchMailData'
      success:
        type: boolean
    type: object
  handler.SendEmailRequest:
    properties:
      account_uid:
        type: string
      bcc:
        items:
          type: string
        type: array
      cc:
        items:
          type: string
        type: array
      html_body:
        type: string
      reply_to:
        type: string
      subject:
        type: string
      text_body:
        type: string
      to:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - account_uid
    - to
    type: object
  handler.Setup2FAResponse:
    properties:
      backup_codes:
        items:
          type: string
        type: array
      qr_code_url:
        type: string
      secret:
        type: string
    type: object
  handler.TestConnectionRequest:
    properties:
      auth_data:
        description: 认证数据 JSON
        type: string
      service_type:
        description: 服务类型
        type: string
    required:
    - auth_data
    - service_type
    type: object
  handler.TestWebhookRequest:
    properties:
      test_data:
        additionalProperties: true
        type: object
    type: object
  handler.UpdateAccountConfigRequest:
    properties:
      auth_data:
        description: 认证数据 JSON
        type: string
      service_type:
        description: 服务类型
        type: string
    required:
    - auth_data
    - service_type
    type: object
  handler.UpdateSMTPConfigRequest:
    properties:
      enabled:
        type: boolean
    type: object
  handler.UpdateWebAPIProviderRequest:
    properties:
      auth_data:
        description: 认证数据 JSON
        type: string
      name:
        description: Provider 名称
        type: string
    type: object
  handler.UpdateWebhookRequest:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      events:
        type: string
      filters:
        type: string
      headers:
        type: string
      max_retries:
        type: integer
      method:
        type: string
      name:
        type: string
      retry_enabled:
        type: boolean
      retry_intervals:
        type: string
      url:
        type: string
    required:
    - events
    - name
    - url
    type: object
  handler.Validate2FALoginRequest:
    properties:
      code:
        type: string
      user_id:
        type: integer
      username:
        description: 可选，用于日志
        type: string
    required:
    - code
    - user_id
    type: object
  handler.Validate2FALoginResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/handler.DBUserInfo'
    type: object
  handler.ValidateConfigRequest:
    properties:
      auth_data:
        description: 认证数据 JSON
        type: string
      service_type:
        description: 服务类型
        type: string
    required:
    - auth_data
    - service_type
    type: object
  handler.Verify2FARequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  model.Adapter:
    properties:
      auth_type:
        description: 认证类型 (oauth2/password)
        type: string
      created_at:
        type: string
      description:
        description: 描述信息
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        type: integer
      is_enabled:
        description: 是否启用
        type: boolean
      name:
        description: 适配器唯一标识 (gmail/graph/imap)
        type: string
      updated_at:
        type: string
    type: object
  model.AdapterResponse:
    properties:
      auth_type:
        type: string
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_enabled:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  model.EmailAccount:
    properties:
      adapter_id:
        description: 用户选择的适配器 ID
        type: integer
      adapter_ref:
        allOf:
        - $ref: '#/definitions/model.Adapter'
        description: 关联的适配器（只读）
      auto_disabled_at:
        description: 自动禁用时间
        type: string
      batch_size:
        description: 每批处理数量，默认 100
        type: integer
      consecutive_auth_failures:
        description: 自动禁用相关字段（用于短期邮箱过期处理）
        type: integer
      created_at:
        description: 元数据
        type: string
      disable_reason:
        description: 禁用原因
        type: string
      email:
        description: 邮箱地址
        type: string
      first_sync_days:
        description: 首次同步优化配置 (Requirements 6.1)
        type: integer
      group_id:
        description: 分组配置
        type: integer
      id:
        type: integer
      last_sync_at:
        type: string
      last_sync_error:
        type: string
      last_sync_status:
        description: success/failed/running
        type: string
      last_uid:
        description: 上次同步的最大 UID，用于增量同步
        type: integer
      max_emails_per_sync:
        description: 单次同步最大邮件数，默认 5000
        type: integer
      parent_account_uid:
        description: WebAPI 父子账户关系
        type: string
      provider_id:
        description: 外键关联
        type: integer
      provider_ref:
        allOf:
        - $ref: '#/definitions/model.Provider'
        description: 关联的提供商（只读）
      proxy_enabled:
        description: 代理配置
        type: boolean
      proxy_host:
        type: string
      proxy_port:
        type: integer
      proxy_type:
        description: http/socks5
        type: string
      proxy_username:
        type: string
      server_delete_policy:
        description: 删除策略配置
        type: string
      smtp_enabled:
        description: SMTP 发送配置
        type: boolean
      status:
        description: 账户状态
        type: string
      sync_cursor:
        description: 同步游标，用于断点续传
        type: string
      sync_enabled:
        description: 同步配置
        type: boolean
      sync_interval:
        description: 同步间隔（分钟）
        type: integer
      sync_progress_json:
        description: 同步进度 JSON，存储详细进度信息
        type: string
      total_emails:
        description: 统计信息
        type: integer
      uid:
        description: 账户唯一标识
        type: string
      uid_validity:
        description: UID 增量同步状态（用于 IMAP 协议）
        type: integer
      unread_count:
        type: integer
      updated_at:
        type: string
    type: object
  model.EmailRule:
    properties:
      account_uid:
        description: 所属账户
        type: string
      actions:
        description: 执行动作（JSON）
        items:
          $ref: '#/definitions/model.RuleAction'
        type: array
      conditions:
        description: 触发条件（JSON）
        items:
          $ref: '#/definitions/model.RuleCondition'
        type: array
      created_at:
        type: string
      description:
        type: string
      enabled:
        description: 规则配置
        type: boolean
      id:
        type: integer
      last_matched_at:
        type: string
      match_mode:
        description: 匹配模式：all（所有条件）或 any（任意条件）
        type: string
      matched_count:
        description: 统计信息
        type: integer
      name:
        type: string
      priority:
        description: 优先级（数字越小越高）
        type: integer
      stop_processing:
        description: 匹配后是否停止处理后续规则
        type: boolean
      updated_at:
        type: string
    type: object
  model.OAuth2ClientCreateRequest:
    properties:
      client_id:
        maxLength: 255
        type: string
      client_secret:
        type: string
      metadata:
        type: string
      name:
        maxLength: 100
        type: string
      provider_id:
        description: 提供商ID
        type: integer
      quota_daily:
        minimum: -1
        type: integer
      quota_monthly:
        minimum: -1
        type: integer
      redirect_uri:
        type: string
    required:
    - client_id
    - client_secret
    - name
    - provider_id
    - redirect_uri
    type: object
  model.OAuth2ClientResponse:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      is_default:
        type: boolean
      last_used_at:
        type: string
      metadata:
        type: string
      name:
        type: string
      provider_id:
        type: integer
      provider_name:
        description: 提供商名称（通过关联获取）
        type: string
      quota_daily:
        type: integer
      quota_monthly:
        type: integer
      redirect_uri:
        type: string
      updated_at:
        type: string
      usage_count:
        type: integer
    type: object
  model.OAuth2ClientUpdateRequest:
    properties:
      client_id:
        maxLength: 255
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      metadata:
        type: string
      name:
        maxLength: 100
        type: string
      provider_id:
        description: 提供商ID（可选）
        type: integer
      quota_daily:
        minimum: -1
        type: integer
      quota_monthly:
        minimum: -1
        type: integer
      redirect_uri:
        type: string
    type: object
  model.Provider:
    properties:
      created_at:
        description: 时间戳
        type: string
      default_adapter:
        allOf:
        - $ref: '#/definitions/model.Adapter'
        description: 默认适配器
      default_adapter_id:
        description: 适配器关联
        type: integer
      description:
        description: 描述信息
        type: string
      display_name:
        description: 显示名称
        type: string
      email_domains:
        description: 支持的邮箱域名列表
        items:
          type: string
        type: array
      enabled:
        description: 管理字段
        type: boolean
      id:
        type: integer
      imap_encryption:
        description: 加密配置
        type: string
      imap_host:
        description: 服务器配置
        type: string
      imap_port:
        description: IMAP端口
        type: integer
      metadata:
        description: JSON格式的额外配置
        type: string
      name:
        description: 基础信息
        type: string
      pop3_encryption:
        description: POP3加密方式 (ssl/starttls/none)
        type: string
      pop3_host:
        description: POP3服务器地址
        type: string
      pop3_port:
        description: POP3端口
        type: integer
      recommended_protocol:
        description: 推荐协议
        type: string
      requires_oauth:
        description: 是否强制OAuth
        type: boolean
      smtp_encryption:
        description: SMTP加密方式 (ssl/starttls/none)
        type: string
      smtp_host:
        description: SMTP服务器地址
        type: string
      smtp_port:
        description: SMTP端口
        type: integer
      sort_order:
        description: 排序顺序
        type: integer
      supported_adapters:
        description: 支持的适配器列表（多对多）
        items:
          $ref: '#/definitions/model.ProviderAdapter'
        type: array
      updated_at:
        type: string
    type: object
  model.ProviderAdapter:
    properties:
      adapter:
        allOf:
        - $ref: '#/definitions/model.Adapter'
        description: 关联的适配器
      adapter_id:
        description: 关联的适配器 ID
        type: integer
      created_at:
        type: string
      priority:
        description: 优先级，0 为最高（默认推荐）
        type: integer
      provider_id:
        description: 关联的提供商 ID
        type: integer
    type: object
  model.ProviderAdapterResponse:
    properties:
      adapter:
        $ref: '#/definitions/model.AdapterResponse'
      adapter_id:
        type: integer
      priority:
        type: integer
      provider_id:
        type: integer
    type: object
  model.ProviderResponse:
    properties:
      created_at:
        type: string
      default_adapter:
        allOf:
        - $ref: '#/definitions/model.AdapterResponse'
        description: 默认适配器
      default_adapter_id:
        description: 默认适配器 ID
        type: integer
      description:
        type: string
      display_name:
        type: string
      email_domains:
        description: 支持的邮箱域名列表
        items:
          type: string
        type: array
      enabled:
        type: boolean
      id:
        type: integer
      imap_encryption:
        type: string
      imap_host:
        type: string
      imap_port:
        type: integer
      metadata:
        type: string
      name:
        type: string
      pop3_encryption:
        type: string
      pop3_host:
        type: string
      pop3_port:
        type: integer
      recommended_protocol:
        type: string
      requires_oauth:
        type: boolean
      smtp_encryption:
        type: string
      smtp_host:
        type: string
      smtp_port:
        type: integer
      sort_order:
        type: integer
      supported_adapters:
        description: 支持的适配器列表
        items:
          $ref: '#/definitions/model.ProviderAdapterResponse'
        type: array
      supported_protocols:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  model.RuleAction:
    properties:
      type:
        description: 动作类型：add_label, remove_label, mark_read, mark_unread, star, unstar,
          archive, delete, move_folder, webhook
        type: string
      value:
        description: 动作参数
        type: string
    type: object
  model.RuleCondition:
    properties:
      field:
        description: 字段：from, to, subject, body, has_attachment
        type: string
      operator:
        description: 操作符：contains, not_contains, equals, not_equals, starts_with,
          ends_with, regex
        type: string
      value:
        description: 值
        type: string
    type: object
  model.SentEmail:
    properties:
      account_uid:
        description: 发送账户 UID
        type: string
      attachment_count:
        description: 附件数量
        type: integer
      attachment_info:
        description: 附件信息（JSON 数组，包含文件名、大小等）
        type: string
      bcc_addresses:
        description: 密送列表（JSON 数组）
        type: string
      cc_addresses:
        description: 抄送列表（JSON 数组）
        type: string
      created_at:
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: 软删除
      error_message:
        description: 错误信息（如果失败）
        type: string
      forward_from_id:
        description: 转发的原邮件 ID（本地 Email 表 ID）
        type: integer
      from_address:
        description: 发件人地址
        type: string
      from_name:
        description: 发件人名称
        type: string
      has_attachments:
        description: 附件信息
        type: boolean
      html_body:
        description: HTML 正文
        type: string
      id:
        type: integer
      in_reply_to:
        description: In-Reply-To 邮件头
        type: string
      last_retry_at:
        description: 最后重试时间
        type: string
      message_id:
        description: 邮件 Message-ID（RFC 2822）
        type: string
      provider_msg_id:
        description: 服务商返回的消息 ID
        type: string
      references:
        description: References 邮件头
        type: string
      reply_to_email_id:
        description: 关联信息（回复/转发）
        type: integer
      retry_count:
        description: 重试次数
        type: integer
      sender_type:
        description: 发送器信息
        type: string
      sent_at:
        description: 发送时间
        type: string
      size_bytes:
        description: 元数据
        type: integer
      status:
        description: |-
          发送状态
          Requirements: 7.2, 7.3
        type: string
      subject:
        description: 邮件内容
        type: string
      text_body:
        description: 纯文本正文
        type: string
      to_addresses:
        description: 收件人列表（JSON 数组）
        type: string
      updated_at:
        type: string
    type: object
  request.CreateRuleRequest:
    properties:
      account_uid:
        description: 账户 UID
        type: string
      actions:
        description: 动作列表
        items:
          $ref: '#/definitions/model.RuleAction'
        minItems: 1
        type: array
      conditions:
        description: 条件列表
        items:
          $ref: '#/definitions/model.RuleCondition'
        minItems: 1
        type: array
      description:
        description: 规则描述
        type: string
      enabled:
        description: 是否启用
        type: boolean
      match_mode:
        description: 匹配模式：all（所有条件）或 any（任意条件）
        type: string
      name:
        description: 规则名称
        type: string
      priority:
        description: 优先级（数字越小优先级越高）
        type: integer
      stop_processing:
        description: 匹配后是否停止处理后续规则
        type: boolean
    required:
