        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 分组ID：-1=所有，0=未分组，>0=具体分组
        in: query
        name: group_id
        type: integer
      - description: 邮箱搜索
        in: query
        name: email
        type: string
