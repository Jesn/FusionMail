# ============================================
# FusionMail 生产环境 Docker Compose 配置
# 使用外部 Redis 和 PostgreSQL 服务
# export DB_PASSWORD=<your-strong-db-password>
# ENCRYPTION_KEY 只能生成一次保存好，如果更改后则之前的数据无法解密了
# export ENCRYPTION_KEY=$(openssl rand -base64 32 | cut -c1-32)

# docker compose -f docker-compose.prod.yml up -d
# ============================================

services:
  fusionmail:
    image: docker.cnb.cool/rich/public/fusionmail
    container_name: fusionmail
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      # ------------------------------------------
      # 运行模式
      # ------------------------------------------
      GIN_MODE: ${GIN_MODE:-release}

      # ------------------------------------------
      # 数据库配置（外部 PostgreSQL）
      # ------------------------------------------
      DB_HOST: ${DB_HOST:-192.168.2.200}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fusionmail}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      
      # PostgreSQL 客户端环境变量
      PGHOST: ${DB_HOST:-192.168.2.200}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:-fusionmail}

      # ------------------------------------------
      # Redis 配置（外部 Redis）
      # ------------------------------------------
      REDIS_HOST: ${REDIS_HOST:-192.168.2.200}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # ------------------------------------------
      # 安全配置（生产环境必须修改）
      # ------------------------------------------
      # JWT 密钥（至少 32 字符，必须设置）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      
      # 加密密钥（必须是 32 字节，设置后不可更改）
      # 生成命令: openssl rand -base64 32 | cut -c1-32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      
      # 管理员初始密码（可选，建议在生产环境设置）
      # 如果不设置，系统会自动生成随机密码
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      
      # 是否保存密码到文件（生产环境建议设置为 false）
      SAVE_PASSWORD_FILE: ${SAVE_PASSWORD_FILE:-false}

      # ------------------------------------------
      # 服务器配置
      # ------------------------------------------
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-3333}

      # ------------------------------------------
      # 存储配置
      # ------------------------------------------
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/data/attachments}
      
      # ------------------------------------------
      # 速率限制配置
      # ------------------------------------------
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_SITE_REQUESTS_PER_MINUTE: ${RATE_LIMIT_SITE:-100}
      RATE_LIMIT_PUBLIC_REQUESTS_PER_MINUTE: ${RATE_LIMIT_PUBLIC:-200}
      
      # ------------------------------------------
      # Swagger API 文档（生产环境建议关闭）
      # ------------------------------------------
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      
      # ------------------------------------------
      # CORS 配置
      # ------------------------------------------
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://192.168.2.200:3333}
      
      # ------------------------------------------
      # Cookie 安全配置（反向代理场景）
      # ------------------------------------------
      # 如果使用 Nginx 反向代理 + HTTPS，设置为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

    volumes:
      - /data/docekr/fusionmail:/data

