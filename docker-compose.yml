version: '3.8'

# ============================================
# FusionMail 生产环境 Docker Compose 配置
# ============================================
# 使用方法:
#   1. 复制 .env.example 为 .env 并配置必要的环境变量
#   2. 运行: docker-compose up -d
#   3. 访问: http://localhost:3333
#
# 重要提示:
#   - 生产环境必须修改所有默认密码
#   - 建议使用 openssl rand -base64 32 生成强密钥
# ============================================

services:
  # ==========================================
  # PostgreSQL 数据库
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: fusionmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fusionmail
      POSTGRES_USER: fusionmail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fusionmail_password}
      # 性能优化配置
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fusionmail-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusionmail"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 缓存与队列
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: fusionmail-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-fusionmail_redis_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - fusionmail-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fusionmail_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # FusionMail 应用（前后端一体）
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fusionmail-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3333}:3333"
    environment:
      # ------------------------------------------
      # 数据库配置
      # ------------------------------------------
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fusionmail
      DB_PASSWORD: ${DB_PASSWORD:-fusionmail_password}
      DB_NAME: fusionmail
      DB_SSLMODE: disable
      
      # PostgreSQL 客户端环境变量（确保所有 PostgreSQL 客户端使用正确的主机）
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: fusionmail
      PGPASSWORD: ${DB_PASSWORD:-fusionmail_password}
      PGDATABASE: fusionmail
      
      # ------------------------------------------
      # Redis 配置
      # ------------------------------------------
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fusionmail_redis_password}
      
      # ------------------------------------------
      # 安全配置（生产环境必须修改）
      # ------------------------------------------
      # JWT 密钥（至少 32 字符）
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRY_HOURS: 24
      
      # 加密密钥（必须是 32 字节）
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-this-32-byte-key-prod}
      
      # 管理员初始密码（可选，建议在生产环境设置）
      # 如果不设置，系统会自动生成随机密码
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      
      # 是否保存密码到文件（生产环境建议设置为 false）
      SAVE_PASSWORD_FILE: ${SAVE_PASSWORD_FILE:-false}
      
      
      # ------------------------------------------
      # 存储配置
      # ------------------------------------------
      STORAGE_TYPE: local
      # 本地开发时映射到项目目录，生产环境使用 Docker 卷
      STORAGE_LOCAL_PATH: /data/attachments
      
      # ------------------------------------------
      # 速率限制配置
      # ------------------------------------------
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_SITE_REQUESTS_PER_MINUTE: ${RATE_LIMIT_SITE:-100}
      RATE_LIMIT_PUBLIC_REQUESTS_PER_MINUTE: ${RATE_LIMIT_PUBLIC:-200}
      
      # ------------------------------------------
      # Swagger API 文档（生产环境建议关闭）
      # ------------------------------------------
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      
      # ------------------------------------------
      # CORS 配置
      # ------------------------------------------
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:3333}
      
    volumes:
      # 本地开发：挂载到项目目录，方便调试查看附件
      - ./data/attachments:/data/attachments
    networks:
      - fusionmail-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

# ==========================================
# 网络配置
# ==========================================
networks:
  fusionmail-network:
    driver: bridge

# ==========================================
# 数据卷配置
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
