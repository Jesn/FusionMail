# 这里是一个示例 .cnb.yml
  
  # 匹配main分支
  main:
    # 触发事件为push事件
    push:
      # ============================================================
      # 质量门禁：在任何构建/部署之前阻断回归
      #
      # 此前 CI 只做 build/push/deploy，零 go test、零 go vet、零 lint，
      # 导致 test/integration 整个包编译不过也无人发现、pkg/goroutine 里
      # 存在数据竞争也无人发现。这一步是 2.0 重构的安全网。
      #
      # 用 docker run 而非 job 级 image，与下方 docker build 阶段保持同一
      # 执行模型，避免依赖 runner 的镜像预置。
      # ============================================================
      - name: quality-gate
        runner:
          tags: cnb:arch:amd64
        services:
          - docker
        stages:
          - name: 后端 go vet + go test -race
            script: |
              docker run --rm -v "$PWD":/src -w /src/backend golang:1.25-alpine sh -c '
                set -e
                go env -w GOPROXY=https://goproxy.cn,direct GOSUMDB=off
                go vet ./...
                go test ./... -race
              '
          - name: 前端 tsc + vitest + eslint
            script: |
              docker run --rm -v "$PWD":/src -w /src/frontend node:20-alpine sh -c '
                set -e
                npm ci --no-audit --no-fund
                npx tsc --noEmit
                npx vitest run
                npx eslint .
              '

      - imports: https://cnb.cool/rich/tool-group/cnb-secret/-/blob/main/github/secret.yml
        services:
          - docker
        stages:
          - name: sync to github
            image: tencentcom/git-sync
            settings:
              target_url: https://github.com/Jesn/FusionMail.git
              auth_type: https
              username: ${GIT_USERNAME}
              password: ${GIT_ACCESS_TOKEN}
              git_email: ${GIT_EMAIL}
              git_user: ${GIT_USER}

      - runner:
          tags: cnb:arch:amd64
        services:
          - docker
        env:
          IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
        stages:
          - name: docker login
            script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
          - name: docker build
            script: docker build  -t ${IMAGE_TAG} .
          - name: docker push
            script: docker push ${IMAGE_TAG}
          - name: resolve
            type: cnb:resolve
            options:
              key: build-amd64

      - runner:
          tags: cnb:arch:arm64:v8
        services:
          - docker
        env:
          IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-arm64
        stages:
          - name: docker login
            script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
          - name: docker build
            script: docker build -t ${IMAGE_TAG} .
          - name: docker push
            script: docker push ${IMAGE_TAG}
          - name: resolve
            type: cnb:resolve
            options:
              key: build-arm64

      - imports: https://cnb.cool/rich/tool-group/cnb-secret/-/blob/main/mqtt/default.yml
        services:
          - docker
        env:
          IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        stages:
          - name: await the amd64
            type: cnb:await
            options:
              key: build-amd64
          - name: await the arm64
            type: cnb:await
            options:
              key: build-arm64
          - name: manifest
            image: cnbcool/manifest
            settings:
              target: ${IMAGE_TAG}
              template: ${IMAGE_TAG}-OS-ARCH
              platforms:
                - linux/amd64
                - linux/arm64
          - name: remove tag
            type: artifact:remove-tag
            options:
              name: ${CNB_REPO_NAME}
              tags:
                - latest-linux-amd64
                - latest-linux-arm64
              type: docker
          - name: mqtt-publish
            image: docker.cnb.cool/rich/plugins/mqtt:latest
            settings:
              MQTT_URL: $MQTT_URL
              MQTT_TOPIC: cnb/deploy
              MQTT_USERNAME: $MQTT_USERNAME
              MQTT_PASSWORD: $MQTT_PASSWORD
              MQTT_QOS: 2
              MQTT_DEBUG: true
              MQTT_MESSAGE: |-
                {
                  "projectName": "FusionMail",
                  "timestamp": "${CNB_BUILD_START_TIME}",
                  "commitHash": "${CNB_COMMIT_SHORT}",
                  "imageUrl": "${IMAGE_TAG}"
                }

      # 转发 amd64 镜像到 Fly Registry 并部署（fly deploy 直接用镜像, 不再现场构建）
      - name: deploy-to-fly
        imports: https://cnb.cool/rich/tool-group/cnb-secret/-/blob/main/fly/secret.yml
        runner:
          tags: cnb:arch:amd64
        services:
          - docker
        env:
          IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
        stages:
          - name: await the amd64 build
            type: cnb:await
            options:
              key: build-amd64
          - name: pull from cnb registry
            script:
              - docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
              - docker pull ${IMAGE_TAG}
          - name: push image to fly registry
            script:
              - echo "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
              - docker tag ${IMAGE_TAG} registry.fly.io/fusionmail:latest
              - docker push registry.fly.io/fusionmail:latest
          - name: deploy to fly
            # flyio/flyctl 是 distroless 镜像（无 shell），无法直接作为 job 镜像跑 script；
            # 改为 docker cp 把 /flyctl 二进制拷到工作区后在 job 容器内执行，版本仍随官方 latest 更新
            script:
              - docker create --name flyctl-bin flyio/flyctl:latest
              - docker cp flyctl-bin:/flyctl ./flyctl && chmod +x ./flyctl && docker rm flyctl-bin
              - ./flyctl deploy -a fusionmail --image registry.fly.io/fusionmail:latest --config scripts/deploy/fly/fly.toml --now
  